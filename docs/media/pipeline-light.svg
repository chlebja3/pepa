700" fill="#1b1b1a" text-anchor="start">Rychlý model</text><text x="234" y="238" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">vlastní, dotrénovaný</text><text x="234" y="258" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">multilingual-e5-small</text><text x="234" y="278" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">každý blok textu · 0,9 s</text><line x1="436" y1="239" x2="462" y2="239" stroke="#8a8a84" stroke-width="2"/><path d="M461 233 L470 239 L461 245 Z" fill="#8a8a84"/><rect x="470" y="150" width="230" height="144" rx="12" fill="#ffffff" stroke="#e2e2df" stroke-width="1.5"/><rect x="470" y="164" width="4" height="116" rx="2" fill="#2a78d6"/><text x="488" y="180" font-size="16" font-weight="700" fill="#1b1b1a" text-anchor="start">Jazykový model</text><text x="488" y="204" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">vlastní, dotrénovaný</text><text x="488" y="224" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">Qwen3.5-2B (LoRA, Q4)</text><text x="488" y="244" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">potvrdí, nebo odvolá</text><text x="488" y="264" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">a napíše proč · ~2 s</text><line x1="700" y1="222" x2="726" y2="222" stroke="#8a8a84" stroke-width="2"/><path d="M725 216 L734 222 L725 228 Z" fill="#8a8a84"/><line x1="436" y1="125" x2="726" y2="125" stroke="#8a8a84" stroke-width="2"/><path d="M725 119 L734 125 L725 131 Z" fill="#8a8a84"/><rect x="734" y="110" width="190" height="184" rx="12" fill="#ffffff" stroke="#e2e2df" stroke-width="1.5"/><rect x="734" y="124" width="4" height="156" rx="2" fill="#c8102e"/><text x="752" y="140" font-size="16" font-weight="700" fill="#1b1b1a" text-anchor="start">Varování</text><text x="752" y="164" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">oranžové: možný podvod</text><text x="752" y="184" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">červené: téměř jistě</text><text x="752" y="204" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">důvod jednou větou</text><text x="752" y="224" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">rada, co teď dělat</text><text x="752" y="244" font-size="13.5" font-weight="400" fill="#55554f" text-anchor="start">nejasné → mlčí</text></svg>