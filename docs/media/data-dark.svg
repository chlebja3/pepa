<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>Jak vznikla trénovací data</title><rect width="960" height="330" rx="14" fill="#1a1a19"/><text x="30" y="42" font-size="20" font-weight="700" fill="#f1f1ee" text-anchor="start">Jak vznikla trénovací data</text><rect x="20" y="70" width="205" height="200" rx="12" fill="#232322" stroke="#3a3a38" stroke-width="1.5"/><rect x="20" y="84" width="4" height="172" rx="2" fill="#8f8f89"/><text x="38" y="100" font-size="16" font-weight="700" fill="#f1f1ee" text-anchor="start">Zdroje textů</text><text x="38" y="124" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">20 036 veřejných anglických</text><text x="38" y="144" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">textů přeložených do češtiny</text><text x="38" y="164" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start"></text><text x="38" y="184" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">3 977 českých webových</text><text x="38" y="204" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">textů (FineWeb)</text><text x="38" y="224" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start"></text><text x="38" y="244" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">7 000 syntetických zpráv</text><line x1="225" y1="170" x2="237" y2="170" stroke="#8f8f89" stroke-width="2"/><path d="M236 164 L245 170 L236 176 Z" fill="#8f8f89"/><rect x="245" y="70" width="200" height="200" rx="12" fill="#232322" stroke="#3a3a38" stroke-width="1.5"/><rect x="245" y="84" width="4" height="172" rx="2" fill="#d95926"/><text x="263" y="100" font-size="16" font-weight="700" fill="#f1f1ee" text-anchor="start">Dva modely označí</text><text x="263" y="124" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">nezávisle na sobě:</text><text x="263" y="144" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">podvod / běžné / nevím</text><text x="263" y="164" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start"></text><text x="263" y="184" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">shoda → ponecháno</text><text x="263" y="204" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">neshoda → 4 846 vyřazeno</text><text x="263" y="224" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">texty z testu → vyřazeno</text><line x1="445" y1="170" x2="457" y2="170" stroke="#8f8f89" stroke-width="2"/><path d="M456 164 L465 170 L456 176 Z" fill="#8f8f89"/><rect x="465" y="70" width="250" height="200" rx="12" fill="#232322" stroke="#3a3a38" stroke-width="1.5"/><rect x="465" y="84" width="4" height="172" rx="2" fill="#1baf7a"/><text x="483" y="100" font-size="16" font-weight="700" fill="#f1f1ee" text-anchor="start">Trénovací sada</text><text x="483" y="124" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">31 013 textů:</text><text x="483" y="144" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">20 046 běžných · 10 139 podvodů</text><text x="483" y="164" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">828 „nevím“</text><text x="483" y="184" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">+ 3 000 dvojic podvod/běžné</text><text x="483" y="204" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">+ důvod jednou větou, korektura</text><text x="483" y="224" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">+ OCR šum u 30 % textů</text><text x="483" y="244" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">+ běžné konverzace v češtině</text><line x1="715" y1="170" x2="727" y2="170" stroke="#8f8f89" stroke-width="2"/><path d="M726 164 L735 170 L726 176 Z" fill="#8f8f89"/><rect x="735" y="70" width="205" height="200" rx="12" fill="#232322" stroke="#3a3a38" stroke-width="1.5"/><rect x="735" y="84" width="4" height="172" rx="2" fill="#3987e5"/><text x="753" y="100" font-size="16" font-weight="700" fill="#f1f1ee" text-anchor="start">Dotrénování</text><text x="753" y="124" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">Qwen3.5-2B, LoRA</text><text x="753" y="144" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">učí se odpověď, důvod a radu</text><text x="753" y="164" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start"></text><text x="753" y="184" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">export: GGUF Q4_K_M</text><text x="753" y="204" font-size="13.5" font-weight="400" fill="#c2c2bc" text-anchor="start">1,3 GB, běží na procesoru</text><text x="30" y="300" font-size="13" font-weight="400" fill="#8f8f89" text-anchor="start">Žádné soukromé e-maily ani zprávy uživatelů. Testovací data se do trénování nedostala.</text></svg>