<svg xmlns="http://www.w3.org/2000/svg" width="960" height="232" viewBox="0 0 960 232" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>PEPA v číslech: zachytí 92 % podvodů na testovacích datech a 94 % skutečných podvodů, planý poplach u 3 % běžných textů, varování asi za 2 sekundy, provoz zdarma</title><style>.arc{animation:draw 1.3s cubic-bezier(.2,.8,.2,1) both}@keyframes draw{from{stroke-dasharray:0 400}}.pop{animation:spin 1.3s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}@keyframes spin{from{transform:rotate(-120deg)}}@media (prefers-reduced-motion:reduce){.arc,.pop{animation:none}}</style><rect width="960" height="232" rx="14" fill="#fcfcfb"/><rect x="6.0" y="4" width="180.0" height="224" rx="18" fill="#2a78d6" fill-opacity="0.08"/><circle cx="96.0" cy="82" r="47" fill="none" stroke="#2a78d6" stroke-opacity="0.16" stroke-width="10"/><circle cx="96.0" cy="82" r="47" fill="none" stroke="#2a78d6" stroke-width="10" stroke-linecap="round" stroke-dasharray="271.68 295.31" transform="rotate(-90 96.0 82)" class="arc" style="--len:271.68;animation-delay:0.15s"/><text x="96.0" y="93" font-size="31" font-weight="800" fill="#1b1b1a" text-anchor="middle" class="num" style="animation-delay:0.44999999999999996s">92 %</text><text x="96.0" y="174" font-size="17" font-weight="700" fill="#1b1b1a" text-anchor="middle">podvodů zachytí</text><text x="96.0" y="198" font-size="14" fill="#55554f" text-anchor="middle">na testovacích datech</text><rect x="198.0" y="4" width="180.0" height="224" rx="18" fill="#7c5cd6" fill-opacity="0.08"/><circle cx="288.0" cy="82" r="47" fill="none" stroke="#7c5cd6" stroke-opacity="0.16" stroke-width="10"/><circle cx="288.0" cy="82" r="47" fill="none" stroke="#7c5cd6" stroke-width="10" stroke-linecap="round" stroke-dasharray="277.59 295.31" transform="rotate(-90 288.0 82)" class="arc" style="--len:277.59;animation-delay:0.27s"/><text x="288.0" y="93" font-size="31" font-weight="800" fill="#1b1b1a" text-anchor="middle" class="num" style="animation-delay:0.5700000000000001s">94 %</text><text x="288.0" y="174" font-size="17" font-weight="700" fill="#1b1b1a" text-anchor="middle">skutečných podvodů</text><text x="288.0" y="198" font-size="14" fill="#55554f" text-anchor="middle">z českého internetu</text><rect x="390.0" y="4" width="180.0" height="224" rx="18" fill="#eb6834" fill-opacity="0.08"/><circle cx="480.0" cy="82" r="47" fill="none" stroke="#eb6834" stroke-opacity="0.16" stroke-width="10"/><circle cx="480.0" cy="82" r="47" fill="none" stroke="#eb6834" stroke-width="10" stroke-linecap="round" stroke-dasharray="10.34 295.31" transform="rotate(-90 480.0 82)" class="arc" style="--len:10.34;animation-delay:0.39s"/><text x="480.0" y="93" font-size="31" font-weight="800" fill="#1b1b1a" text-anchor="middle" class="num" style="animation-delay:0.69s">3 %</text><text x="480.0" y="174" font-size="17" font-weight="700" fill="#1b1b1a" text-anchor="middle">planých poplachů</text><text x="480.0" y="198" font-size="14" fill="#55554f" text-anchor="middle">u běžných textů</text><rect x="582.0" y="4" width="180.0" height="224" rx="18" fill="#1baf7a" fill-opacity="0.08"/><circle cx="672.0" cy="82" r="47" fill="none" stroke="#1baf7a" stroke-opacity="0.16" stroke-width="10"/><rect x="664.0" y="18" width="16" height="8" rx="3" fill="#1baf7a"/><path d="M710.2 43.8 l6 -6" stroke="#1baf7a" stroke-width="6" stroke-linecap="round"/><circle cx="672.0" cy="82" r="47" fill="none" stroke="#1baf7a" stroke-width="10" stroke-linecap="round" stroke-dasharray="59.06 295.31" transform="rotate(-90 672.0 82)" class="arc" style="--len:59.06;animation-delay:0.51s"/><text x="672.0" y="93" font-size="31" font-weight="800" fill="#1b1b1a" text-anchor="middle" class="num" style="animation-delay:0.81s">~2 s</text><text x="672.0" y="174" font-size="17" font-weight="700" fill="#1b1b1a" text-anchor="middle">do varování</text><text x="672.0" y="198" font-size="14" fill="#55554f" text-anchor="middle">na běžném procesoru</text><rect x="774.0" y="4" width="180.0" height="224" rx="18" fill="#e0a800" fill-opacity="0.08"/><circle cx="864.0" cy="82" r="47" fill="none" stroke="#e0a800" stroke-width="10" stroke-dasharray="4 3.2" class="pop" style="animation-delay:0.63s"/><circle cx="864.0" cy="82" r="38" fill="none" stroke="#e0a800" stroke-opacity=".45" stroke-width="2"/><text x="864.0" y="93" font-size="31" font-weight="800" fill="#1b1b1a" text-anchor="middle" class="num" style="animation-delay:0.9299999999999999s">0 Kč</text><text x="864.0" y="174" font-size="17" font-weight="700" fill="#1b1b1a" text-anchor="middle">za provoz</text><text x="864.0" y="198" font-size="14" fill="#55554f" text-anchor="middle">žádný účet, žádné API</text></svg>