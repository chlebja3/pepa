<svg xmlns="http://www.w3.org/2000/svg" width="960" height="330" viewBox="0 0 960 330" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif" role="img"><title>Skutečné podvody podle délky textu</title><rect width="960" height="330" rx="14" fill="#1a1a19"/><text x="30" y="42" font-size="20" font-weight="700" fill="#f1f1ee" text-anchor="start">Skutečné podvody z českého internetu</text><text x="30" y="66" font-size="14" font-weight="400" fill="#c2c2bc" text-anchor="start">109 ze 116 zachyceno (94 %); podle délky textu, celý řetězec v pomocníkovi</text><line x1="90" y1="202.5" x2="660" y2="202.5" stroke="#3a3a38" stroke-width="1"/><text x="82" y="206.5" font-size="12" font-weight="400" fill="#8f8f89" text-anchor="end">50 %</text><line x1="90" y1="130.0" x2="660" y2="130.0" stroke="#3a3a38" stroke-width="1"/><text x="82" y="134.0" font-size="12" font-weight="400" fill="#8f8f89" text-anchor="end">100 %</text><rect x="110" y="162.22222222222223" width="84" height="14.111111111111118" rx="3" fill="#d95926"/><rect x="110" y="178.33333333333334" width="84" height="96.66666666666666" rx="3" fill="#ff5a6e"/><text x="152" y="152.22222222222223" font-size="14" font-weight="700" fill="#f1f1ee" text-anchor="middle">14 z 18</text><text x="152" y="295" font-size="12.5" font-weight="400" fill="#c2c2bc" text-anchor="middle">do 80 znaků</text><rect x="250" y="130.0" width="84" height="7.666666666666664" rx="3" fill="#d95926"/><rect x="250" y="139.66666666666666" width="84" height="135.33333333333334" rx="3" fill="#ff5a6e"/><text x="292" y="120.0" font-size="14" font-weight="700" fill="#f1f1ee" text-anchor="middle">15 z 15</text><text x="292" y="295" font-size="12.5" font-weight="400" fill="#c2c2bc" text-anchor="middle">80–200</text><rect x="390" y="135.0" width="84" height="3.0000000000000098" rx="3" fill="#d95926"/><rect x="390" y="140.0" width="84" height="135.0" rx="3" fill="#ff5a6e"/><text x="432" y="125.0" font-size="14" font-weight="700" fill="#f1f1ee" text-anchor="middle">28 z 29</text><text x="432" y="295" font-size="12.5" font-weight="400" fill="#c2c2bc" text-anchor="middle">200–500</text><rect x="530" y="135.37037037037038" width="84" height="6.055555555555543" rx="3" fill="#d95926"/><rect x="530" y="143.42592592592592" width="84" height="131.57407407407408" rx="3" fill="#ff5a6e"/><text x="572" y="125.37037037037038" font-size="14" font-weight="700" fill="#f1f1ee" text-anchor="middle">52 z 54</text><text x="572" y="295" font-size="12.5" font-weight="400" fill="#c2c2bc" text-anchor="middle">přes 500</text><line x1="90" y1="275" x2="660" y2="275" stroke="#c2c2bc" stroke-width="1.5"/><rect x="110" y="92" width="12" height="12" rx="3" fill="#ff5a6e"/><text x="128" y="103" font-size="12.5" font-weight="400" fill="#c2c2bc" text-anchor="start">červené</text><rect x="200" y="92" width="12" height="12" rx="3" fill="#d95926"/><text x="218" y="103" font-size="12.5" font-weight="400" fill="#c2c2bc" text-anchor="start">oranžové</text><rect x="700" y="96" width="236" height="196" rx="12" fill="#232322" stroke="#3a3a38" stroke-width="1.5"/><text x="720" y="132" font-size="14" font-weight="600" fill="#c2c2bc" text-anchor="start">Skutečné běžné zprávy</text><text x="720" y="184" font-size="38" font-weight="800" fill="#f1f1ee" text-anchor="start">0 z 32</text><text x="720" y="212" font-size="14" font-weight="400" fill="#c2c2bc" text-anchor="start">falešných poplachů</text><text x="720" y="248" font-size="12.5" font-weight="400" fill="#8f8f89" text-anchor="start">výstrahy ČHMÚ, obce, úřady,</text><text x="720" y="266" font-size="12.5" font-weight="400" fill="#8f8f89" text-anchor="start">zprávy o podvodech</text><text x="30" y="316" font-size="13" font-weight="400" fill="#8f8f89" text-anchor="start">Uniklo 7 podvodů, hlavně krátké útržky a texty o zásilce bez zjevné žádosti, kterým chybí kontext zprávy.</text></svg>